# Persistent scrollback across reboots + tmux/byobu session save-restore
# see: ~/.tmux/scripts/replay-logs.sh, ~/.tmux/logs/

set -g history-limit 100000

# --- Continuous per-pane logging (real scrollback persistence) ---
# Every pane's output is appended to a flat log file for as long as the pane
# lives. This is the only thing that actually survives a reboot: tmux's live
# scrollback buffer is memory-only and is gone once the server dies.
run-shell 'mkdir -p ~/.tmux/logs'
# (pane-log.sh does nothing when logging is switched off in session-browser)
set-hook -g after-new-session  'run-shell -b "~/.tmux/scripts/pane-log.sh #{pane_id} #{session_name}_#{window_index}-#{pane_index}"'
set-hook -g after-new-window   'run-shell -b "~/.tmux/scripts/pane-log.sh #{pane_id} #{session_name}_#{window_index}-#{pane_index}"'
set-hook -g after-split-window 'run-shell -b "~/.tmux/scripts/pane-log.sh #{pane_id} #{session_name}_#{window_index}-#{pane_index}"'

# --- tmux-resurrect / tmux-continuum: save+restore session layout ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-hook-post-restore-all '~/.tmux/scripts/replay-logs.sh'

# restore-on-server-start follows the tmux toggle in session-browser (read at tmux start)
if-shell 'test -e ~/.config/desktop-session-persistence/disabled/tmux' "set -g @continuum-restore 'off'" "set -g @continuum-restore 'on'"
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
